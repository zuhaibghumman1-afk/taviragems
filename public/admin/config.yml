# Tavira Gems admin panel (Sveltia CMS). Opens at https://taviragems.com/admin/
# Generated by scripts/build-admin-config.mjs. Edit that script, not this file.
backend:
  name: github
  repo: zuhaibghumman1-afk/taviragems
  branch: main
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"

site_url: https://taviragems.com
display_url: https://taviragems.com
logo_url: /favicon.svg
media_folder: public/images/uploads
public_folder: /images/uploads

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  - name: stones
    label: Stones
    label_singular: Stone
    folder: src/content/stones
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [title, updated]
    view_groups:
      - { label: Section, field: section }
    fields:
      - { label: "Stone name", name: title, widget: string }
      - { label: "One-line summary", name: tagline, widget: string, required: false, hint: "Shown under the name, e.g. The blue stone of kings" }
      - { label: "Short description", name: summary, widget: text, required: false, hint: "1–2 sentences. Used on cards, in Google results and when shared." }
      - { label: "Main photo", name: image, widget: image, required: false, hint: "Square or 4:5, at least 1200px. Converted to WebP automatically." }
      - { label: "Photo description (accessibility and SEO)", name: image_alt, widget: string, required: false }
      - { label: "Photo credit", name: image_credit, widget: string, required: false, hint: "e.g. Smithsonian Institution, CC0" }
      - { label: "Photo source link", name: image_credit_url, widget: string, required: false }
      - label: Section
        name: section
        widget: select
        options:
          - { label: "Gemstones", value: "gemstones" }
          - { label: "Decorative Stones", value: "decorative-stones" }
          - { label: "Crystals & Minerals", value: "crystals-minerals" }
      - label: Category
        name: categories
        widget: select
        multiple: true
        options:
          - { label: "Gemstones: Precious", value: "precious" }
          - { label: "Gemstones: Semi-Precious", value: "semi-precious" }
          - { label: "Gemstones: Rare & Collector", value: "rare" }
          - { label: "Gemstones: Organic", value: "organic" }
          - { label: "Decorative Stones: Marble", value: "marble" }
          - { label: "Decorative Stones: Granite", value: "granite" }
          - { label: "Decorative Stones: Onyx", value: "onyx" }
          - { label: "Decorative Stones: Quartzite", value: "quartzite" }
          - { label: "Decorative Stones: Limestone & Travertine", value: "limestone-travertine" }
          - { label: "Decorative Stones: Semi-Precious Slabs", value: "semi-precious-slabs" }
          - { label: "Crystals & Minerals: Carving & Ornamental", value: "carving-ornamental" }
          - { label: "Crystals & Minerals: Crystals & Specimens", value: "crystals-specimens" }
          - { label: "Crystals & Minerals: Unique & Unusual", value: "unique-unusual" }
      - label: Colors
        name: colors
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Red", value: "red" }
          - { label: "Pink", value: "pink" }
          - { label: "Orange", value: "orange" }
          - { label: "Yellow", value: "yellow" }
          - { label: "Green", value: "green" }
          - { label: "Blue", value: "blue" }
          - { label: "Purple", value: "purple" }
          - { label: "Brown", value: "brown" }
          - { label: "Black", value: "black" }
          - { label: "White & Colorless", value: "white" }
          - { label: "Multicolor", value: "multicolor" }
          - { label: "Color-Change", value: "color-change" }
      - label: "Birthstone month"
        name: birth_months
        widget: select
        multiple: true
        required: false
        options:
          - { label: "January", value: "january" }
          - { label: "February", value: "february" }
          - { label: "March", value: "march" }
          - { label: "April", value: "april" }
          - { label: "May", value: "may" }
          - { label: "June", value: "june" }
          - { label: "July", value: "july" }
          - { label: "August", value: "august" }
          - { label: "September", value: "september" }
          - { label: "October", value: "october" }
          - { label: "November", value: "november" }
          - { label: "December", value: "december" }
      - label: Rarity
        name: rarity
        widget: select
        required: false
        options:
          - { label: "Common", value: "common" }
          - { label: "Uncommon", value: "uncommon" }
          - { label: "Rare", value: "rare" }
          - { label: "Extremely Rare", value: "extremely-rare" }
      - { label: "Feature on homepage", name: featured, widget: boolean, default: false }
      - { label: "Draft (hidden from visitors)", name: draft, widget: boolean, default: false }
      - { label: "Mohs hardness (from)", name: hardness_min, widget: number, value_type: float, min: 1, max: 10, step: 0.5, required: false }
      - { label: "Mohs hardness (to)", name: hardness_max, widget: number, value_type: float, min: 1, max: 10, step: 0.5, required: false, hint: "Leave empty for a single value" }
      - { label: "Mineral family", name: mineral_family, widget: string, required: false }
      - { label: "Chemical formula", name: chemical_formula, widget: string, required: false, hint: "Type normally, e.g. Al2O3. Numbers become subscripts automatically." }
      - { label: "Crystal system", name: crystal_system, widget: select, required: false, options: [Cubic, Tetragonal, Hexagonal, Trigonal, Orthorhombic, Monoclinic, Triclinic, Amorphous] }
      - { label: "Refractive index", name: refractive_index, widget: string, required: false }
      - { label: "Specific gravity", name: specific_gravity, widget: string, required: false }
      - { label: "Main sources / origin", name: main_sources, widget: string, required: false }
      - { label: "Wedding anniversary", name: anniversary, widget: string, required: false }
      - { label: "Price tier", name: price_tier, widget: string, required: false, hint: "$ to $$$$, e.g. $$ – $$$" }
      - { label: "Rock type (decorative stones)", name: rock_type, widget: select, required: false, options: [Metamorphic, Igneous, Sedimentary] }
      - { label: "Porosity (decorative stones)", name: porosity, widget: select, required: false, options: [Low, Medium, High] }
      - { label: "Finishes (decorative stones)", name: finishes, widget: select, multiple: true, required: false, options: [Polished, Honed, Leathered, Brushed, Flamed, Backlit] }
      - { label: "Best uses (decorative stones)", name: best_uses, widget: string, required: false }
      - { label: "Last updated", name: updated, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { label: "Article", name: body, widget: markdown }

  - name: articles
    label: "Guides, Comparisons & Journal"
    label_singular: Article
    folder: src/content/articles
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{kind}})"
    view_groups:
      - { label: Type, field: kind }
    fields:
      - { label: Title, name: title, widget: string }
      - label: Type
        name: kind
        widget: select
        options:
          - { label: "Learn (guide)", value: learn }
          - { label: "Compare", value: compare }
          - { label: "Journal (story)", value: journal }
      - { label: "Short description", name: summary, widget: text, required: false }
      - { label: "Main image", name: image, widget: image, required: false }
      - { label: "Image description", name: image_alt, widget: string, required: false }
      - { label: "Publish date", name: date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: "Last updated", name: updated, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { label: "Related stones", name: related_stones, widget: relation, collection: stones, value_field: "{{slug}}", search_fields: [title], display_fields: [title], multiple: true, required: false }
      - { label: "Draft (hidden from visitors)", name: draft, widget: boolean, default: false }
      - { label: "Article", name: body, widget: markdown }

  - name: settings
    label: "Site settings"
    files:
      - label: "Homepage text"
        name: home
        file: src/data/home.json
        format: json
        fields:
          - { label: "Hero small label", name: hero_eyebrow, widget: string }
          - { label: "Hero headline", name: hero_title, widget: string }
          - { label: "Word to highlight in gold", name: hero_highlight, widget: string, required: false }
          - { label: "Hero text", name: hero_text, widget: text }
          - { label: "Hero stone", name: hero_stone, widget: relation, collection: stones, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
          - label: "Popular links"
            name: popular
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: url, widget: string }
          - { label: "Three worlds: title", name: worlds_title, widget: string }
          - { label: "Three worlds: text", name: worlds_text, widget: text }
          - { label: "Featured stones: title", name: featured_title, widget: string }
          - { label: "Colors: title", name: colors_title, widget: string }
          - { label: "Colors: text", name: colors_text, widget: text }
          - { label: "Facts: title", name: facts_title, widget: string }
          - label: "Did you know? facts"
            name: facts
            widget: list
            max: 3
            fields:
              - { label: Fact, name: text, widget: text }
              - { label: "Link text", name: link_label, widget: string }
              - { label: Link, name: url, widget: string }
          - { label: "Spotlight stone", name: spotlight_stone, widget: relation, collection: stones, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
          - { label: "Spotlight label", name: spotlight_eyebrow, widget: string }
          - { label: "Guides: title", name: guides_title, widget: string }
          - { label: "Journal: title", name: journal_title, widget: string }
          - { label: "Trust strip: title", name: trust_title, widget: string }
          - { label: "Trust strip: sources", name: trust_sources, widget: list }
          - { label: "Trust strip: text", name: trust_text, widget: text }
      - label: "General & ads"
        name: site
        file: src/data/site.json
        format: json
        fields:
          - { label: "Site name", name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: "Default description (Google)", name: description, widget: text }
          - { label: "Author name", name: author, widget: string }
          - { label: "Show ads", name: ads_enabled, widget: boolean, default: false, hint: "Keep off until an ad network approves the site." }
          - { label: "Ad code: after Quick Facts", name: ads_code_after_facts, widget: text, required: false }
          - { label: "Ad code: middle of article", name: ads_code_mid_content, widget: text, required: false }
          - { label: "Ad code: end of article", name: ads_code_end_of_content, widget: text, required: false }
          - { label: "Cloudflare Web Analytics token", name: analytics_token, widget: string, required: false }
